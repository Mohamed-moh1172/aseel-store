<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="utf-8" />
  <style>
    @font-face {
      font-family: "Amiri";
      src: url("fonts/Amiri-Regular.ttf") format("truetype");
      font-weight: 400;
      font-style: normal;
      font-display: block;
    }
    @font-face {
      font-family: "Amiri";
      src: url("fonts/Amiri-Bold.ttf") format("truetype");
      font-weight: 700;
      font-style: normal;
      font-display: block;
    }
    @font-face {
      font-family: "Cinzel";
      src: url("fonts/Cinzel.ttf") format("truetype");
      font-weight: 400 900;
      font-style: normal;
      font-display: block;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #F5F1E8;
    }

    .card {
      width: 1200px;
      height: 630px;
      position: relative;
      background:
        radial-gradient(ellipse 78% 68% at 50% 42%, #FBF8F1 0%, #F5F1E8 58%, #E8DFCC 100%);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .frame-outer {
      position: absolute;
      inset: 20px;
      border: 1.5px solid #C9A961;
      pointer-events: none;
    }
    .frame-inner {
      position: absolute;
      inset: 28px;
      border: 0.75px solid rgba(201, 169, 97, 0.72);
      pointer-events: none;
    }

    .star {
      position: absolute;
      width: 12px;
      height: 12px;
      z-index: 2;
      color: #C9A961;
    }
    .star.tl { top: 22px; left: 22px; }
    .star.tr { top: 22px; right: 22px; }
    .star.bl { bottom: 22px; left: 22px; }
    .star.br { bottom: 22px; right: 22px; }
    .star svg { display: block; width: 12px; height: 12px; }

    .lockup {
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 1;
    }

    .logo {
      width: 236px;
      height: 236px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      margin-bottom: 10px;
    }

    .ar-title {
      font-family: Amiri, serif;
      font-weight: 700;
      font-size: 56px;
      color: #C9A961;
      line-height: 1;
      direction: rtl;
      unicode-bidi: isolate;
      letter-spacing: 0.04em;
    }

    .en-title {
      font-family: Cinzel, serif;
      font-weight: 650;
      font-variation-settings: "wght" 650;
      font-size: 24px;
      color: #C9A961;
      letter-spacing: 0.52em;
      line-height: 1;
      margin-top: 8px;
      padding-left: 0.52em;
      text-transform: uppercase;
    }

    .rule {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 14px 0 12px;
    }
    .rule-line {
      width: 70px;
      height: 1px;
      background: #C9A961;
      opacity: 0.9;
    }
    .rule-star {
      width: 10px;
      height: 10px;
      color: #C9A961;
    }
    .rule-star svg { display: block; width: 10px; height: 10px; }

    .sub {
      font-family: Amiri, serif;
      font-weight: 400;
      font-size: 24px;
      color: #2D5F3F;
      direction: rtl;
      unicode-bidi: isolate;
      line-height: 1;
      letter-spacing: 0.06em;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="frame-outer"></div>
    <div class="frame-inner"></div>
    <div class="star tl"><svg viewBox="0 0 12 12" aria-hidden="true"><path fill="currentColor" d="M6 0.4 L6.85 4.55 L11.6 6 L6.85 7.45 L6 11.6 L5.15 7.45 L0.4 6 L5.15 4.55 Z"/></svg></div>
    <div class="star tr"><svg viewBox="0 0 12 12" aria-hidden="true"><path fill="currentColor" d="M6 0.4 L6.85 4.55 L11.6 6 L6.85 7.45 L6 11.6 L5.15 7.45 L0.4 6 L5.15 4.55 Z"/></svg></div>
    <div class="star bl"><svg viewBox="0 0 12 12" aria-hidden="true"><path fill="currentColor" d="M6 0.4 L6.85 4.55 L11.6 6 L6.85 7.45 L6 11.6 L5.15 7.45 L0.4 6 L5.15 4.55 Z"/></svg></div>
    <div class="star br"><svg viewBox="0 0 12 12" aria-hidden="true"><path fill="currentColor" d="M6 0.4 L6.85 4.55 L11.6 6 L6.85 7.45 L6 11.6 L5.15 7.45 L0.4 6 L5.15 4.55 Z"/></svg></div>
    <div class="lockup">
      <img class="logo" src="brand/logo.webp" alt="" />
      <div class="ar-title">أسيل</div>
      <div class="en-title">ASEEL</div>
      <div class="rule">
        <div class="rule-line"></div>
        <div class="rule-star"><svg viewBox="0 0 10 10" aria-hidden="true"><path fill="currentColor" d="M5 0.3 L5.7 3.8 L9.7 5 L5.7 6.2 L5 9.7 L4.3 6.2 L0.3 5 L4.3 3.8 Z"/></svg></div>
        <div class="rule-line"></div>
      </div>
      <div class="sub">عطور و اكسسوارات</div>
    </div>
  </div>
</body>
</html>
